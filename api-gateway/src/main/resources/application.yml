server: { port: 8080 }
spring:
  application: { name: api-gateway }
  cloud:
    gateway:
      discovery: { locator: { enabled: true, lower-case-service-id: true } }
      routes:
        - { id: investor, uri: lb://investor-service, predicates: [ Path=/investors/**,Path=/bank-mandates/**,Path=/nominees/**,Path=/kyc-documents/** ] }
        - { id: scheme, uri: lb://scheme-service, predicates: [ Path=/schemes/** ] }
        - { id: folio, uri: lb://folio-service, predicates: [ Path=/folios/** ] }
        - { id: transaction, uri: lb://transaction-service, predicates: [ Path=/transactions/** ] }
        - { id: statement, uri: lb://statement-service, predicates: [ Path=/statements/** ] }
eureka: { client: { service-url: { defaultZone: http://localhost:8761/eureka/ } } }
